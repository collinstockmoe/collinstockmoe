<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collin Stockmoe — Portfolio</title>
<style>

  /* ============================================
     FONT
     Monument Grotesk Mono is a licensed font and is
     NOT loaded from a CDN. Drop the woff2 files next
     to this index.html and they'll be picked up
     automatically. Until the files are added, this
     falls back to a comparable system mono.

     TYPE HIERARCHY (site-wide):
       - Mega name (Collin / Stockmoe)  -> Bold, largest thing on any page
       - Project / content titles       -> Bold, second tier
       - Page headings & subheaders     -> Regular, dark, third tier
       - Body copy (descriptions, prose) -> Light, gray, smallest
       - Nav: current page -> bold + dark. everything else -> regular + gray
     ============================================ */
  @font-face {
    font-family: 'Monument Grotesk Mono';
    src: url('MonumentGroteskMono-Thin.woff2') format('woff2');
    font-weight: 100;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Monument Grotesk Mono';
    src: url('MonumentGroteskMono-Light.woff2') format('woff2');
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Monument Grotesk Mono';
    src: url('MonumentGroteskMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Monument Grotesk Mono';
    src: url('MonumentGroteskMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Monument Grotesk Mono';
    src: url('MonumentGroteskMono-Italic.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  :root{
    --mono: 'Monument Grotesk Mono', ui-monospace, 'SF Mono', 'JetBrains Mono', 'Roboto Mono', Consolas, Menlo, monospace;
    --w-thin: 100;
    --w-light: 300;
    --w-regular: 400;
    --w-bold: 700;
    --black: #111111;
    --line: #111111;
    --gray: #8a8a8a;
    --paper: #ffffff;
    --col-left: 320px;
    --col-right: 300px;
    --gutter: 28px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--black);
    font-family: var(--mono);
    height: 100%;
    overflow: hidden; /* the columns scroll independently, not the page */
  }

  body{
    font-size: 13px;
    line-height: 1.6;
    font-weight: var(--w-light);
    -webkit-font-smoothing: antialiased;
  }

  a{
    color: var(--black);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-weight: var(--w-light);
  }
  a:hover{ color: var(--gray); }

  strong, b{ font-weight: var(--w-bold); }

  /* ============================================
     MEGA NAME — reused on the home page and at the
     top of every inner-page sidebar. Sized to fill
     the fixed 320px left column edge to edge, wraps
     to two lines (COLLIN / STOCKMOE) via block spans.
     ============================================ */
  .mega-name{
    margin: 0 0 20px 0;
    line-height: 0.9;
  }
  .mega-name .word{
    display: block;
    font-size: 54px;
    font-weight: var(--w-bold);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* ============================================
     INNER PAGES: 3-column grid
     (left = identity/nav, center = routed content,
     right = about + contact, varies per page)
     ============================================ */
  .wrap{
    display: none;
    grid-template-columns: var(--col-left) 1px 1fr 1px var(--col-right);
    height: 100vh;
  }
  body:not(.is-home) .wrap{ display: grid; }
  .wrap.no-right{
    grid-template-columns: var(--col-left) 1px 1fr;
  }
  .wrap.no-right #ruleRight,
  .wrap.no-right #rightcol{
    display: none;
  }

  .rule-v{
    background: var(--line);
    width: 1px;
    height: 100vh;
  }

  .scroll-col{
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #ccc transparent;
  }
  .scroll-col::-webkit-scrollbar{ width: 6px; }
  .scroll-col::-webkit-scrollbar-thumb{ background: #dcdcdc; }
  .scroll-col::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- LEFT (INNER PAGES): IDENTITY + NAV ---------- */
  .bio{
    padding: var(--gutter);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  .headshot{
    width: 100%;
    aspect-ratio: 648 / 710;
    object-fit: cover;
    filter: grayscale(100%);
    display: block;
    border: 1px solid var(--line);
    margin-bottom: 26px;
  }

  .hr{
    border: none;
    border-top: 1px solid var(--line);
    margin: 20px 0;
  }

  .contact-block a.email{
    display: block;
    text-decoration: none;
    color: var(--gray);
    margin-bottom: 10px;
  }
  .contact-block a.email:hover{ color: var(--black); }
  .contact-block a.social{
    display: block;
    margin-bottom: 4px;
    text-decoration: none;
    color: var(--black);
    font-weight: var(--w-regular);
  }
  .contact-block a.social:hover{ color: var(--gray); }

  /* nav links, both the inner sidebar and the home directory:
     current page is bold + dark, everything else is regular + gray,
     all at the same font size */
  nav.sitenav{
    margin-top: 6px;
  }
  nav.sitenav a{
    display: block;
    text-decoration: none;
    font-size: 15px;
    font-weight: var(--w-regular);
    color: var(--gray);
    margin-bottom: 20px;
    letter-spacing: 0.01em;
  }
  nav.sitenav a:hover{ color: var(--black); }
  nav.sitenav a.current{
    color: var(--black);
    font-weight: var(--w-bold);
  }

  h2.label{
    font-size: 11px;
    font-weight: var(--w-regular);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--black);
    text-decoration: underline;
    text-underline-offset: 3px;
    margin: 0 0 10px 0;
  }

  /* ---------- CENTER (INNER PAGES): ROUTED CONTENT ---------- */
  .feed{
    padding: var(--gutter);
    min-height: 100%;
  }

  /* page heading / kicker — sits above the larger content
     titles it introduces (e.g. project names), so it reads
     as a true subheader without competing with them */
  .page-label{
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 22px;
    font-weight: var(--w-regular);
    color: var(--black);
    margin: 0 0 34px 0;
  }

  /* -- projects feed: one project at a time, large format -- */
  .feed-project{
    margin-bottom: 64px;
  }
  .feed-project .strip{
    width: 100%;
    display: block;
    border: 1px solid var(--line);
    margin-bottom: 20px;
    cursor: pointer;
    background: #f4f4f4;
  }
  .feed-project .strip img{
    width: 100%;
    display: block;
    filter: grayscale(15%);
    transition: filter .2s ease;
  }
  .feed-project .strip:hover img{ filter: grayscale(0%); }
  .feed-project .strip.no-image{
    aspect-ratio: 16 / 7;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .feed-project .meta-row{
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 40px;
  }
  .feed-project h3{
    font-size: 30px;
    font-weight: var(--w-bold);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0 0 6px 0;
  }
  .feed-project .year{
    font-size: 12px;
    color: var(--gray);
    font-weight: var(--w-light);
  }
  .feed-project .desc p{
    margin: 0 0 16px 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--gray);
    font-weight: var(--w-light);
  }
  .feed-project .view-link{
    font-size: 13px;
    font-weight: var(--w-regular);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    color: var(--black);
    font-family: var(--mono);
  }
  .feed-project .view-link:hover{ color: var(--gray); }

  @media (max-width: 760px){
    .feed-project .meta-row{ grid-template-columns: 1fr; gap: 4px; }
  }

  /* -- secondary projects list (business & marketing) -- */
  .index-category{
    margin-top: 12px;
    margin-bottom: 40px;
  }
  .index-category .cat-label{
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--black);
    font-weight: var(--w-regular);
    margin-bottom: 14px;
  }
  .index-item{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 20px;
    padding: 10px 0;
    border-bottom: 1px solid #eaeaea;
    cursor: pointer;
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    text-align: left;
    font-family: var(--mono);
  }
  .index-item .idx-title{
    font-size: 16px;
    font-weight: var(--w-light);
    color: var(--black);
  }
  .index-item:hover .idx-title{ color: var(--gray); text-decoration: underline; }
  .index-item .idx-year{
    font-size: 12px;
    color: var(--gray);
    white-space: nowrap;
  }

  /* -- resume page -- */
  .resume-block{ margin-bottom: 30px; }
  .resume-block .entry{
    margin-bottom: 18px;
  }
  .resume-block .org{
    font-style: italic;
    font-weight: var(--w-regular);
    color: var(--black);
    display: block;
  }
  .resume-block .sub{ display: block; color: var(--gray); font-size: 12px; margin-bottom: 6px; }
  .resume-block ul{
    margin: 6px 0 0 0;
    padding-left: 16px;
  }
  .resume-block li{
    margin-bottom: 4px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--gray);
    font-weight: var(--w-light);
  }

  /* -- about page (no right column — gets the extra width,
        laid out as a two-column grid of sections at desktop) -- */
  .about-lead{
    font-size: 17px;
    font-weight: var(--w-regular);
    color: var(--black);
    line-height: 1.6;
    max-width: 62ch;
    margin: 0 0 56px 0;
  }
  .about-sections{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 60px;
    max-width: 940px;
  }
  .about-section{
    padding-top: 26px;
    border-top: 1px solid #eaeaea;
    margin-bottom: 26px;
  }
  .about-section:nth-child(-n+2){
    border-top: none;
    padding-top: 0;
  }
  .about-section .sec-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: var(--w-regular);
    color: var(--black);
    margin-bottom: 10px;
  }
  .about-section .sec-label .num{
    color: var(--gray);
    margin-right: 4px;
  }
  .about-section p{
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--gray);
    font-weight: var(--w-light);
    margin: 0;
    max-width: 46ch;
  }

  @media (max-width: 900px){
    .about-sections{ grid-template-columns: 1fr; max-width: 62ch; }
    .about-section:nth-child(-n+2){ border-top: 1px solid #eaeaea; padding-top: 26px; }
    .about-section:first-child{ border-top: none; padding-top: 0; }
  }

  /* -- contact page -- */
  .contact-form{
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 460px;
    margin-bottom: 44px;
  }
  .contact-form label{
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--black);
    font-weight: var(--w-regular);
  }
  .contact-form input,
  .contact-form textarea{
    font-family: var(--mono);
    font-size: 14px;
    color: var(--black);
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 8px 0;
    outline: none;
    resize: vertical;
  }
  .contact-form input:focus,
  .contact-form textarea:focus{
    border-bottom-color: var(--gray);
  }
  .contact-form .form-submit{
    align-self: flex-start;
    margin-top: 6px;
    padding: 11px 24px;
    background: var(--black);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .contact-form .form-submit:hover{ background: var(--gray); }
  .contact-form .form-submit:disabled{ background: var(--gray); cursor: default; }
  .form-status{
    font-size: 12px;
    color: var(--gray);
    margin: -8px 0 0 0;
  }

  .contact-page-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--black);
    font-weight: var(--w-regular);
    margin: 0 0 14px 0;
  }
  .contact-page a{
    display: block;
    font-size: 18px;
    font-weight: var(--w-regular);
    color: var(--black);
    margin-bottom: 12px;
    text-decoration: none;
  }
  .contact-page a:hover{ color: var(--gray); }

  /* ---------- RIGHT (INNER PAGES): varies per page ---------- */
  .rightcol{
    padding: var(--gutter);
    min-height: 100%;
  }
  .rightcol .about-brief{
    margin-bottom: 30px;
  }
  .rightcol .about-brief p{
    font-size: 12.5px;
    line-height: 1.6;
    margin: 0;
    color: var(--gray);
    font-weight: var(--w-light);
    text-transform: lowercase;
  }

  /* ============================================
     HOME PAGE: name + description pinned top-left,
     directory truly centered in the viewport.
     ============================================ */
  .home-page{
    display: none;
    position: relative;
    height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  body.is-home .home-page{ display: block; }

  .home-intro{
    position: absolute;
    top: var(--gutter);
    left: var(--gutter);
    max-width: 320px;
  }
  .home-intro .home-tagline{
    font-size: 13px;
    line-height: 1.6;
    color: var(--gray);
    font-weight: var(--w-light);
    text-transform: lowercase;
    margin: 0 0 14px 0;
    max-width: 34ch;
  }
  .home-intro .home-caption{
    font-size: 11px;
    color: var(--gray);
    font-weight: var(--w-light);
    margin: 0;
  }

  .home-directory-wrap{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  nav.home-nav{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  nav.home-nav a{
    font-size: 26px;
    font-weight: var(--w-regular);
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    text-decoration: none;
    width: fit-content;
  }
  nav.home-nav a:hover{ color: var(--black); }
  nav.home-nav a.current{
    color: var(--black);
    font-weight: var(--w-bold);
  }

  /* ---------- BACK TO TOP (mobile only) ---------- */
  .back-to-top{
    display: none;
  }

  /* ---------- PDF MODAL ---------- */
  .pdf-modal{
    position: fixed;
    inset: 0;
    background: rgba(17,17,17,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 28px;
  }
  .pdf-modal.open{ display: flex; }
  .pdf-modal-inner{
    width: 100%;
    height: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pdf-modal-bar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #eee;
    font-size: 13px;
  }
  .pdf-modal-bar .pm-title{ font-style: italic; }
  .pdf-close{
    background: none;
    border: 1px solid #555;
    color: #eee;
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .pdf-close:hover{ border-color: #fff; color: #fff; }
  .pdf-modal-inner iframe{
    flex: 1;
    width: 100%;
    border: none;
    background: #525659;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 1080px){
    html, body{ overflow: auto; height: auto; }
    body:not(.is-home) .wrap,
    body:not(.is-home) .wrap.no-right{
      grid-template-columns: 1fr;
      height: auto;
    }
    .rule-v{
      width: 100%;
      height: 1px;
    }
    .scroll-col{
      height: auto;
      overflow: visible;
    }
    .headshot{
      max-width: 340px;
    }
    .home-page{
      height: auto;
      overflow: visible;
    }
    .home-intro{
      position: static;
      max-width: none;
      margin-bottom: 50px;
    }
    .home-directory-wrap{
      min-height: auto;
      display: block;
    }
    .mega-name .word{ font-size: clamp(40px, 13vw, 84px); }
    .feed-project .meta-row{
      grid-template-columns: 1fr;
    }
    .back-to-top{
      display: block;
      width: 100%;
      margin: 50px 0 24px 0;
      padding: 15px;
      text-align: center;
      background: none;
      border: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--black);
      cursor: pointer;
    }
    .back-to-top:hover{ background: var(--black); color: var(--paper); }
  }

  @media (max-width: 480px){
    :root{ --gutter: 18px; }
    body{ font-size: 12.5px; }
  }

</style>
</head>
<body>

<!-- HOME: name + description top-left, directory truly centered -->
<div class="home-page" id="homePage">
  <div class="home-intro" id="homeIntro"></div>
  <div class="home-directory-wrap">
    <div class="home-directory" id="homeDirectory"></div>
  </div>
</div>

<!-- INNER PAGES: identity/nav (left) + routed content (center) + right column (varies per page) -->
<div class="wrap" id="wrap">
  <aside class="scroll-col" id="leftcol"></aside>
  <div class="rule-v" id="ruleLeft"></div>
  <main class="scroll-col" id="center-content"></main>
  <div class="rule-v" id="ruleRight"></div>
  <aside class="rightcol scroll-col" id="rightcol"></aside>
</div>

<!-- back to top — mobile only, sits after whichever container is active -->
<button class="back-to-top" id="backToTop" type="button">back to top &uarr;</button>

<!-- PDF VIEWER MODAL -->
<div class="pdf-modal" id="pdfModal">
  <div class="pdf-modal-inner">
    <div class="pdf-modal-bar">
      <span class="pm-title" id="pmTitle"></span>
      <button class="pdf-close" id="pdfClose">&times; close</button>
    </div>
    <iframe id="pdfFrame" src=""></iframe>
  </div>
</div>

<script>
  // ---- project data (display order = Saddles, Dress Trousers, Modern Americana, Universal Design) ----
  const PROJECTS = [
    {
      id: 'saddles',
      title: 'Saddles — Big &amp; Tall Shacket',
      year: '2025',
      category: 'Product Development',
      blurb: 'Technical design, grading, and marker-making for a patchwork canvas shacket, built as a complete Men\u2019s Big &amp; Tall (XL to 5XL) size run.',
      cover: 'assets/saddles-preview.png',
      pdf: 'projects/saddles.pdf'
    },
    {
      id: 'dress-trousers',
      title: 'Dress Trousers',
      year: '2025',
      category: 'Product Development',
      blurb: 'A fully handmade pair of dress trousers, drafted over three fit iterations to refine rise, seat drape, and waist suppression.',
      cover: 'assets/dress-trousers-preview.png',
      pdf: 'projects/dress-trousers.pdf'
    },
    {
      id: 'modern-americana',
      title: 'Modern Americana',
      year: '2025',
      category: 'Computer Aided Design',
      blurb: 'A digitally developed menswear capsule rooted in Westernwear tradition, carried from mood board through Gerber AccuMark patterns and CLO3D virtual fitting.',
      cover: null,
      pdf: 'projects/modern-americana.pdf'
    },
    {
      id: 'universal-design',
      title: 'Universal Design Trousers',
      year: '2025',
      category: 'Product Development',
      blurb: 'A trouser patterned around NC State\u2019s Principles of Universal Design, with an adjustable back belt tab built in for a more accommodating fit.',
      cover: null,
      pdf: 'projects/universal-design.pdf'
    },
    {
      id: 'allen-edmonds',
      title: 'Allen Edmonds — Gen-X Brand Analysis',
      year: '2025',
      category: 'Marketing',
      blurb: 'A brand and SWOT analysis exploring how Allen Edmonds can deepen relevance with Generation X through personalization, retail experience, and strategic partnerships.',
      cover: null,
      pdf: 'projects/allen-edmonds.pdf'
    }
  ];

  // ---- PDF modal ----
  const pdfModal = document.getElementById('pdfModal');
  const pdfFrame = document.getElementById('pdfFrame');
  const pmTitle = document.getElementById('pmTitle');

  function openProject(id){
    const p = PROJECTS.find(x => x.id === id);
    if(!p) return;
    pmTitle.textContent = p.title.replace(/&amp;/g, '&');
    pdfFrame.src = p.pdf;
    pdfModal.classList.add('open');
  }
  function closeProject(){
    pdfModal.classList.remove('open');
    pdfFrame.src = '';
  }
  document.getElementById('pdfClose').addEventListener('click', closeProject);
  pdfModal.addEventListener('click', (e) => { if(e.target === pdfModal) closeProject(); });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && pdfModal.classList.contains('open')) closeProject();
  });

  // ---- back to top (mobile) ----
  document.getElementById('backToTop').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---- shared nav link data ----
  const NAV_LINKS = [
    { route: '', label: 'home' },
    { route: 'projects', label: 'projects' },
    { route: 'about', label: 'about' },
    { route: 'resume', label: 'resume' },
    { route: 'contact', label: 'contact' }
  ];

  function buildNav(currentRoute){
    return NAV_LINKS.map(l =>
      `<a href="#${l.route}" data-route="${l.route}"${l.route === currentRoute ? ' class="current"' : ''}>${l.label}</a>`
    ).join('');
  }

  const homeIntro = document.getElementById('homeIntro');
  const homeDirectory = document.getElementById('homeDirectory');
  const wrap = document.getElementById('wrap');
  const leftcol = document.getElementById('leftcol');
  const center = document.getElementById('center-content');
  const rightcol = document.getElementById('rightcol');

  const MEGA_NAME = '<span class="word">Collin</span><span class="word">Stockmoe</span>';

  // ---- RIGHT COLUMN (inner pages): About+Contact by default,
  // Contact only on Resume, hidden entirely on About (see route()) ----
  function renderRight(hash){
    const showAbout = hash !== 'resume';
    rightcol.innerHTML = `
      ${showAbout ? `
      <div class="about-brief">
        <h2 class="label">About</h2>
        <p>junior at north carolina state university studying fashion &amp; textile management. focused on garment construction, pattern development, and technical design.</p>
      </div>
      <hr class="hr">` : ''}
      <div>
        <h2 class="label">Contact</h2>
        <div class="contact-block">
          <a class="email" href="mailto:collinstockmoe@gmail.com">collinstockmoe@gmail.com</a>
          <a class="social" href="https://www.instagram.com/collinstockmoe/" target="_blank" rel="noopener">instagram</a>
          <a class="social" href="https://www.linkedin.com/in/collin-stockmoe-900470246/" target="_blank" rel="noopener">linkedin</a>
        </div>
      </div>
    `;
  }

  // ---- HOME: name + description top-left, directory centered ----
  function renderHome(){
    homeIntro.innerHTML = `
      <h1 class="mega-name">${MEGA_NAME}</h1>
      <p class="home-tagline">fashion &amp; textile management, concentrating in product development &amp; management at nc state university.</p>
      <p class="home-caption">raleigh, nc</p>
    `;
    homeDirectory.innerHTML = `<nav class="home-nav">${buildNav('')}</nav>`;
  }

  // ---- LEFT COLUMN (inner pages): mega name + photo + nav ----
  function renderLeftInner(currentRoute){
    leftcol.className = 'bio scroll-col';
    leftcol.innerHTML = `
      <div>
        <h1 class="mega-name">${MEGA_NAME}</h1>
        <img class="headshot" src="assets/headshot.png" alt="Portrait of Collin Stockmoe">
        <nav class="sitenav" id="sitenav">${buildNav(currentRoute)}</nav>
      </div>
    `;
  }

  // ---- CENTER: projects page (visual feed, in specified order, + secondary list) ----
  function viewProjects(){
    center.className = 'feed scroll-col';
    center.innerHTML = '<p class="page-label">Design &amp; Production</p><div id="feedList"></div>';
    const list = document.getElementById('feedList');

    PROJECTS.filter(p => p.category !== 'Marketing').forEach(p => {
      const block = document.createElement('div');
      block.className = 'feed-project';
      block.innerHTML = `
        <div class="strip${p.cover ? '' : ' no-image'}" data-id="${p.id}">
          ${p.cover ? `<img src="${p.cover}" alt="${p.title}">` : 'view project'}
        </div>
        <div class="meta-row">
          <div>
            <h3>${p.title}</h3>
            <span class="year">${p.year}</span>
          </div>
          <div class="desc">
            <p>${p.blurb}</p>
            <button class="view-link" data-id="${p.id}">view the project &rarr;</button>
          </div>
        </div>
      `;
      list.appendChild(block);
    });

    const marketing = PROJECTS.filter(p => p.category === 'Marketing');
    if(marketing.length){
      const catBlock = document.createElement('div');
      catBlock.className = 'index-category';
      catBlock.innerHTML = `<div class="cat-label">Business &amp; Marketing</div>`;
      marketing.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'index-item';
        btn.innerHTML = `<span class="idx-title">${p.title}</span><span class="idx-year">${p.year}</span>`;
        btn.addEventListener('click', () => openProject(p.id));
        catBlock.appendChild(btn);
      });
      list.appendChild(catBlock);
    }

    list.querySelectorAll('.strip[data-id], .view-link[data-id]').forEach(el => {
      el.addEventListener('click', () => openProject(el.getAttribute('data-id')));
    });
  }

  function viewResume(){
    center.className = 'feed scroll-col';
    center.innerHTML = `
      <p class="page-label">Resume</p>
      <div class="resume-block">
        <h2 class="label">Education</h2>
        <div class="entry">
          <span class="org">North Carolina State University — Wilson College of Textiles</span>
          <span class="sub">B.S. Fashion &amp; Textile Management, conc. Product Development &amp; Management — 2023 to present</span>
          <ul>
            <li>Curriculum spans business, merchandising, and marketing alongside industry-ready training in pattern-making, grading, and apparel construction.</li>
            <li>Foundational textile science coursework in fiber science, fabric formation, and material performance.</li>
          </ul>
        </div>
      </div>

      <div class="resume-block">
        <h2 class="label">Experience</h2>
        <div class="entry">
          <span class="org">Assistant Store Manager / Sales Associate — Tecovas</span>
          <span class="sub">Raleigh, NC &amp; Dallas, TX — June 2023 to present</span>
          <ul>
            <li>Manager on Duty overseeing daily floor operations, inbound shipments, cycle counts, and staff deployment.</li>
            <li>Drove performance by analyzing KPIs and training the team on customer cadence and product storytelling.</li>
          </ul>
        </div>
        <div class="entry">
          <span class="org">Special Events Manager — The Sanctuary Music &amp; Events</span>
          <span class="sub">McKinney, TX — Nov 2022 to Aug 2023</span>
          <ul>
            <li>Coordinated logistics and staff for weddings and formal events, managing guest experience start to finish.</li>
          </ul>
        </div>
        <div class="entry">
          <span class="org">Retail Sales Associate — Brooks Brothers</span>
          <span class="sub">Allen, TX — Oct 2021 to Nov 2022</span>
          <ul>
            <li>Provided tailored-fitting and formalwear styling guidance rooted in classic menswear fundamentals.</li>
          </ul>
        </div>
      </div>

      <div class="resume-block">
        <h2 class="label">Skills</h2>
        <ul>
          <li>Adobe Illustrator &amp; Photoshop</li>
          <li>Gerber AccuMark — pattern design, grading, marker making</li>
          <li>CLO 3D — virtual fitting &amp; simulation</li>
          <li>Technical product development — tech packs, construction callouts, sourcing</li>
          <li>Market &amp; trend analysis, supply chain literacy</li>
        </ul>
      </div>
    `;
  }

  function viewAbout(){
    center.className = 'feed scroll-col';
    center.innerHTML = `
      <p class="page-label">About</p>

      <p class="about-lead">junior at north carolina state university studying fashion &amp; textile management, concentrating in product development &amp; management. my focus is garment construction, pattern making, grading, and how it all translates into commercial production.</p>

      <div class="about-sections">

        <div class="about-section">
          <div class="sec-label"><span class="num">01.</span>origins</div>
          <p>i grew up in dallas, texas, where an early love of vintage clothing turned into a genuine respect for fashion. that relationship with vintage still shapes how i design today, with real appreciation for fashion history and the people who came before me.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">02.</span>process</div>
          <p>my process actually started digitally. i taught myself illustrator and photoshop around age ten, originally with graphic design in mind. fashion became the real passion later on, and the software just turned into the tool that got me there.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">03.</span>history</div>
          <p>vintage led me to research the designers behind the pieces i loved, which turned into a year long senior thesis on the history of fashion, centered on rick owens, margiela, the antwerp six, raf simons, and mcqueen. that project still shapes how i work: study everything about a subject, then pull pieces of it into something new.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">04.</span>business</div>
          <p>my major has taught me to see fashion as a business as much as a craft. i design practically, always asking whether something can actually be made and sold before it exists for its own sake.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">05.</span>trade</div>
          <p>reselling was my other way in, something i have done at different levels for about eight years. buying and reselling contemporary luxury like rick owens, margiela, alyx, and balenciaga pushed me deep into trend analysis, and in my strongest years i moved upwards of $30,000 in clothing.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">06.</span>craft</div>
          <p>most of my professional experience is in retail, at heritage companies like tecovas and brooks brothers. on my own time at tecovas i taught myself a lot about leather, including more exotic hides, and picked up real cobbling skills: dyeing, reshaping, relasting, even stitching goodyear welts back onto boots. growing up in texas around western wear gave me a lasting respect for things built to hold up over time, which is a big reason i design against fast fashion.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">07.</span>outlook</div>
          <p>i try to approach everything with an open mind, treating life as a process of learning as much as possible. failure tends to teach more than comfort does, so i stay open to it.</p>
        </div>

        <div class="about-section">
          <div class="sec-label"><span class="num">08.</span>next</div>
          <p>i am moving to new york city in summer 2027 after graduation. this semester i am also building my senior studio collection, meridian, six looks centered on balance, built from minimal, detail oriented design that blends heritage tailoring with something more contemporary.</p>
        </div>

      </div>
    `;
  }

  function viewContact(){
    center.className = 'feed scroll-col';
    center.innerHTML = `
      <p class="page-label">Contact</p>

      <!--
        FORM SETUP: this posts to Formspree (https://formspree.io), a free
        service that forwards form submissions straight to an inbox with
        no backend required. Replace YOUR_FORM_ID below with the endpoint
        Formspree gives you after you create a free account and a new form.
      -->
      <form class="contact-form" id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label>name
          <input type="text" name="name" required>
        </label>
        <label>email
          <input type="email" name="email" required>
        </label>
        <label>subject
          <input type="text" name="subject" required>
        </label>
        <label>message
          <textarea name="message" rows="6" required></textarea>
        </label>
        <button type="submit" class="form-submit">send message</button>
        <p class="form-status" id="formStatus"></p>
      </form>

      <p class="contact-page-label">or reach me directly</p>
      <div class="contact-page">
        <a href="mailto:collinstockmoe@gmail.com">collinstockmoe@gmail.com</a>
        <a href="https://www.instagram.com/collinstockmoe/" target="_blank" rel="noopener">instagram</a>
        <a href="https://www.linkedin.com/in/collin-stockmoe-900470246/" target="_blank" rel="noopener">linkedin</a>
      </div>
    `;

    const form = document.getElementById('contactForm');
    const status = document.getElementById('formStatus');
    const submitBtn = form.querySelector('.form-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'sending...';
      submitBtn.disabled = true;
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if(res.ok){
          status.textContent = 'message sent — thanks, i will get back to you soon.';
          form.reset();
        } else {
          status.textContent = 'something went wrong. please email me directly instead.';
        }
      } catch(err){
        status.textContent = 'something went wrong. please email me directly instead.';
      }
      submitBtn.disabled = false;
    });
  }

  const INNER_ROUTES = {
    'projects': viewProjects,
    'resume': viewResume,
    'about': viewAbout,
    'contact': viewContact
  };

  function route(){
    const hash = location.hash.replace('#', '');

    if(!hash || !INNER_ROUTES[hash]){
      // HOME: name + description top-left, directory centered
      document.body.classList.add('is-home');
      renderHome();
    } else {
      // INNER PAGES: mega name + photo + nav (left) / routed content (center) / right column (varies)
      document.body.classList.remove('is-home');
      renderLeftInner(hash);
      INNER_ROUTES[hash]();

      if(hash === 'about'){
        wrap.classList.add('no-right');
      } else {
        wrap.classList.remove('no-right');
        renderRight(hash);
      }

      center.scrollTop = 0;
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  route();
</script>

</body>
</html>
